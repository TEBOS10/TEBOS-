# A manual button: shows (or, unticked, applies) what migrations the live
# database is missing. Normally CI's "Apply database migrations" job does this
# after every green push to main.
name: Apply database migrations (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would be applied"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: tebos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tebos/package-lock.json
      - run: npm ci
      - run: node scripts/migrate.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_CA: ${{ secrets.SUPABASE_DB_CA }}
